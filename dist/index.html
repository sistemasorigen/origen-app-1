<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <!-- Defensa adicional contra un index.html cacheado sirviendo hashes de
       JS/CSS que ya no existen: la mayoría de los navegadores ignora estos
       meta http-equiv para el cacheo real de la página (a diferencia de un
       header HTTP), así que esto no reemplaza el Cache-Control real que
       manda el hosting (ver public/.htaccess) — es sólo la capa extra que
       no cuesta nada agregar por si algún cliente sí la respeta. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- Red de seguridad para "Failed to load module script (...) MIME type
       of text/html": pasa cuando ESTA página quedó cacheada apuntando al
       bundle de un deploy anterior, y ese archivo ya no existe (cada
       deploy vacía dist/ y genera hashes nuevos) — el fallback de SPA
       (mod_rewrite en .htaccess / el equivalente del hosting) responde
       con index.html en vez de un 404, y el navegador lo rechaza por
       MIME type.
       Cuando esto pasa, el  <script type="importmap">
    {
      "imports": {
        "react": "https://aistudiocdn.com/react@^19.2.1",
        "react-dom/client": "https://aistudiocdn.com/react-dom@^19.2.1/client",
        "react-dom": "https://aistudiocdn.com/react-dom@^19.2.1/",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
        "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.10.1",
        "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
        "recharts": "https://aistudiocdn.com/recharts@^2.15.0",
        "idb": "https://aistudiocdn.com/idb@^8.0.0",
        "clsx": "https://aistudiocdn.com/clsx@^2.1.0",
        "tailwind-merge": "https://aistudiocdn.com/tailwind-merge@^2.2.1",
        "react/": "https://aistudiocdn.com/react@^19.2.1/",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.0"
      }
    }
    </script>
 <script type="module"> de abajo directamente
       nunca llega a ejecutarse — React nunca monta — así que nada de lo
       que vive dentro de la app (useVersionCheck, el ErrorBoundary) tiene
       chance de reaccionar. Por eso este listener vive acá, en un script
       NO module que corre siempre, ANTES de que el módulo principal
       intente cargar. Los errores de recursos (<script>, <img>, etc.) no
       burbujean, así que hace falta capture:true en window para poder
       escucharlos. Un solo reintento —marcado en sessionStorage— con
       cache-busting real en la URL. Si el reintento también falla, no
       hay loop: mejor mostrar el error una vez que quedarse recargando
       solo para siempre. -->
  <script>
    (function () {
      var RETRY_KEY = 'origen_module_load_retry';
      window.addEventListener('error', function (event) {
        var target = event.target;
        if (!target || target.tagName !== 'SCRIPT' || target.type !== 'module') return;
        if (sessionStorage.getItem(RETRY_KEY)) return;
        try {
          sessionStorage.setItem(RETRY_KEY, '1');
        } catch (e) {
          // sessionStorage no disponible (modo privado estricto, etc.) —
          // sin poder marcar el intento, mejor no reintentar que arriesgar
          // un loop.
          return;
        }
        var url = new URL(window.location.href);
        url.searchParams.set('_cb', Date.now().toString());
        window.location.href = url.toString();
      }, true);
    })();
  </script>

  <style>

    /* Global Font Styles */
    body {
      font-family: 'Proxima Nova', system-ui, sans-serif;
    }

    h1, h2, h3, h4 {
      font-family: 'Proxima Nova', system-ui, sans-serif;

    }

    /* Groups.tsx Exception - Preserve original fonts */
    .groups-original-fonts,
    .groups-original-fonts * {

    }
    .groups-original-fonts h1,
    .groups-original-fonts h2,
    .groups-original-fonts h3,
    .groups-original-fonts h4 {
      font-family: 'Plus Jakarta Sans', sans-serif !important;
    }

    /* Base transitions */
    body,
    div,
    span,
    button,
    input,
    textarea,
    select {
      transition-property: background-color, border-color, color, fill, stroke;
      transition-duration: 300ms;
      transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Animation Delays */
    .animation-delay-200 {
      animation-delay: 200ms;
    }

    .animation-delay-400 {
      animation-delay: 400ms;
    }

    .animation-delay-600 {
      animation-delay: 600ms;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
    }

    .dark .glass-card {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
    }

    .dark .glass-panel {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* GLOBAL INPUT OVERRIDES - HIGH READABILITY */
    /* Targets standard data entry fields while excluding buttons and toggles */
    input:not([type="submit"]):not([type="button"]):not([type="reset"]):not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="range"]):not([type="color"]):not([type="image"]),
    textarea,
    select {
      background-color: #ffffff !important;
      color: #000000 !important;
      border: 1px solid #cbd5e1 !important;
      /* Slate-300 for visible structure */
      border-radius: 0.5rem;
      /* Slight rounded corners for modern look */
    }

    /* Dark Mode Specific Overrides - Enforce White Input Fields */
    .dark input:not([type="submit"]):not([type="button"]):not([type="reset"]):not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="range"]):not([type="color"]):not([type="image"]),
    .dark textarea,
    .dark select {
      background-color: #ffffff !important;
      color: #000000 !important;
      border-color: #94a3b8 !important;
      /* Slate-400 for contrast against dark bg */
    }

    /* Placeholder Visibility */
    ::placeholder {
      color: #64748b !important;
      /* Slate-500 - Readable Gray */
      opacity: 1;
    }

    /* Focus States for Accessibility */
    input:focus,
    textarea:focus,
    select:focus {
      outline: 2px solid #2563eb !important;
      /* Blue-600 */
      border-color: #2563eb !important;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    /* Tablero de /reportes/gcx — el override global de arriba le pone borde
       slate y radio 0.5rem a todo campo, y en esta pantalla eso se ve como
       un cuadro ajeno adentro de las tarjetas (el buscador de la tabla
       quedaba con doble borde). Scopeado por id, que le gana al !important
       global por especificidad. */
    #gcx-reportes input:not([type="submit"]):not([type="button"]):not([type="reset"]):not([type="checkbox"]):not([type="radio"]),
    #gcx-reportes select {
      background-color: #ffffff !important;
      color: #0f172a !important;
      border: 1px solid #e8e9ec !important;
      border-radius: 9px;
    }

    /* El buscador de la tabla va desnudo: el borde y el radio los dibuja su
       contenedor, no el input. */
    #gcx-reportes input.campo-desnudo {
      border: 0 !important;
      background-color: transparent !important;
      border-radius: 0;
    }

    #gcx-reportes input:focus,
    #gcx-reportes select:focus {
      outline: none !important;
      border-color: #2563eb !important;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    #gcx-reportes input.campo-desnudo:focus {
      border: 0 !important;
      box-shadow: none;
    }

    /* Pantallas de acción de /mis-grupos/:id — campos del diseño nuevo:
       fondo blanco sobre el gris de página, radio 22px y SIN borde.
       Scopeado por id igual que /auth: el override global de arriba usa
       !important, y cualquier id le gana por especificidad. */
    #gcx-accion input:not([type="submit"]):not([type="button"]):not([type="reset"]):not([type="checkbox"]):not([type="radio"]),
    #gcx-accion textarea,
    #gcx-accion select {
      background-color: #ffffff !important;
      border: 1px solid transparent !important;
      border-radius: 22px !important;
    }

    #gcx-accion input:not([type="submit"]):not([type="button"]):not([type="reset"]):not([type="checkbox"]):not([type="radio"]):focus,
    #gcx-accion textarea:focus,
    #gcx-accion select:focus {
      outline: none !important;
      border-color: #0a0a0a !important;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.06);
    }

    .dark #gcx-accion input:not([type="submit"]):not([type="button"]):not([type="reset"]):not([type="checkbox"]):not([type="radio"]),
    .dark #gcx-accion textarea,
    .dark #gcx-accion select {
      background-color: #1b1b1a !important;
      color: #ffffff !important;
    }

    /* Modales de inscripción a GCX (design-claude/JoinFlow). El override
       global de arriba le pone a todo campo fondo blanco, borde slate y un
       anillo de foco azul; en esta hoja el campo va gris sin borde visible y
       el foco es negro, o rosa en el tramo de la pareja. Scopeado por id, que
       le gana al !important global por especificidad. */
    /* Para ganarle al override global hay que repetir su cadena de :not(),
       y eso le da a la regla base más especificidad que a cualquier regla de
       estado escrita con un selector más corto: el foco nunca llegaría a
       pintarse. Por eso la base consume variables y cada estado solo las
       redefine; las variables se resuelven por herencia, no por especificidad. */
    #gcx-inscripcion {
      --insc-campo-fondo: #f4f4f5;
      --insc-campo-tinta: #0a0a0a;
      --insc-campo-borde: transparent;
    }

    .dark #gcx-inscripcion {
      --insc-campo-fondo: #26262a;
      --insc-campo-tinta: #f7f7f8;
    }

    #gcx-inscripcion input:not([type="submit"]):not([type="button"]):not([type="reset"]):not([type="checkbox"]):not([type="radio"]) {
      background-color: var(--insc-campo-fondo) !important;
      color: var(--insc-campo-tinta) !important;
      border: 1.5px solid var(--insc-campo-borde) !important;
      border-radius: 16px !important;
      padding: 15px 16px;
      font-weight: 600;
      /* 16px es el mínimo que no dispara el zoom automático de iOS al enfocar */
      font-size: 16px;
      outline: none !important;
      box-shadow: none !important;
    }

    /* El foco se ve por el borde y el fondo: el campo pasa de gris sin borde a
       blanco con borde negro, o rosa en el tramo de la pareja. */
    #gcx-inscripcion input:focus {
      --insc-campo-fondo: #ffffff;
      --insc-campo-borde: #0a0a0a;
    }

    .dark #gcx-inscripcion input:focus {
      --insc-campo-fondo: #1c1c1f;
      --insc-campo-borde: #f7f7f8;
    }

    #gcx-inscripcion input.campo-pareja:focus {
      --insc-campo-borde: #ec4b7f;
    }

    /* Más específica que :focus a propósito: el error sigue a la vista
       mientras la persona corrige el campo. */
    #gcx-inscripcion input.campo-error {
      --insc-campo-borde: #d92d20;
      --insc-campo-fondo: #fef3f2;
    }

    #gcx-inscripcion input:disabled {
      --insc-campo-fondo: #f0f0f1;
      --insc-campo-tinta: #9a9aa0;
    }

    .dark #gcx-inscripcion input:disabled {
      --insc-campo-fondo: #26262a;
      --insc-campo-tinta: #6e6e73;
    }

    #gcx-inscripcion ::placeholder {
      color: #9a9aa0 !important;
    }

    .dark #gcx-inscripcion ::placeholder {
      color: #7a7a80 !important;
    }

    /* index.css tiene un "modo foco": mientras hay un modal abierto esconde
       todo <header> y <nav> de la página para que no se vean por detrás. Esa
       regla alcanzaba también a la cabecera de esta hoja, que vive adentro del
       modal: quedaba con altura 0 y sin título ni barra de pasos. Se exceptúa
       por id, que le gana en especificidad. */
    body[data-modal-active="true"] #gcx-inscripcion header {
      display: flex !important;
    }

    /* Las cuatro animaciones del diseño: entrada de cada bloque nuevo, latido
       del paso en curso, spinner y el sello de "encontramos a tu pareja". */
    @keyframes inscSube {
      from { opacity: 0; transform: translateY(10px) }
      to { opacity: 1; transform: translateY(0) }
    }

    @keyframes inscLate {
      0%, 100% { opacity: 1 }
      50% { opacity: .25 }
    }

    @keyframes inscGira {
      to { transform: rotate(360deg) }
    }

    @keyframes inscSello {
      0% { transform: scale(.6); opacity: 0 }
      60% { transform: scale(1.08) }
      100% { transform: scale(1); opacity: 1 }
    }

    .insc-sube { animation: inscSube .3s ease both }
    .insc-late { animation: inscLate 1.8s ease-in-out infinite }
    .insc-gira { animation: inscGira .8s linear infinite }
    .insc-sello { animation: inscSello .45s cubic-bezier(.2, .9, .3, 1.2) both }

    @media (prefers-reduced-motion: reduce) {

      .insc-sube,
      .insc-late,
      .insc-gira,
      .insc-sello {
        animation: none !important;
      }
    }

    /* Pantalla de crear / editar un grupo. Los campos van embutidos en
       recuadros grises adentro de tarjetas blancas, así que acá el control
       casi siempre es .campo-desnudo; esto es el piso para el resto. */
    #gcx-formulario input:not([type="submit"]):not([type="button"]):not([type="reset"]):not([type="checkbox"]):not([type="radio"]),
    #gcx-formulario textarea,
    #gcx-formulario select {
      background-color: #f7f7f5 !important;
      border: 1px solid transparent !important;
      border-radius: 20px !important;
    }

    .dark #gcx-formulario input:not([type="submit"]):not([type="button"]):not([type="reset"]):not([type="checkbox"]):not([type="radio"]),
    .dark #gcx-formulario textarea,
    .dark #gcx-formulario select {
      background-color: #232322 !important;
      color: #ffffff !important;
    }

    /* La caja de portada la dibuja SubidaImagen, que trae su propio borde
       punteado y radio 12. Se reviste desde acá en vez de tocar ese
       componente, que lo usan muchas pantallas con otro aspecto. */
    #gcx-panel .caja-portada>div,
    #gcx-formulario .caja-portada>div {
      border: 0 !important;
      border-radius: 20px !important;
      background-color: #f7f7f5 !important;
    }

    .dark #gcx-formulario .caja-portada>div {
      background-color: #232322 !important;
    }

    /* Panel GCX (design-claude/Admin GCX - Panel). El override global le pone
       a todo campo fondo blanco, borde slate y anillo azul, y acá los campos
       van sobre gris claro, con radio grande y foco negro. Mismo recurso que
       en los modales de inscripción: la base consume variables y cada estado
       solo las redefine, así el foco no tiene que ganarle en especificidad a
       una regla que repite la cadena de :not(). */
    #gcx-panel,
    #gcx-coordinadores {
      --panel-campo-fondo: #f7f7f5;
      --panel-campo-borde: transparent;
    }

    #gcx-panel input:not([type="submit"]):not([type="button"]):not([type="reset"]):not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="range"]):not([type="color"]),
    #gcx-panel textarea,
    #gcx-panel select,
    #gcx-coordinadores input:not([type="submit"]):not([type="button"]):not([type="reset"]):not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="range"]):not([type="color"]),
    #gcx-coordinadores textarea,
    #gcx-coordinadores select {
      background-color: var(--panel-campo-fondo) !important;
      color: #0a0a0a !important;
      border: 1.5px solid var(--panel-campo-borde) !important;
      border-radius: 14px !important;
      font-size: 15px;
      font-weight: 500;
      outline: none !important;
      box-shadow: none !important;
    }

    #gcx-panel input:focus,
    #gcx-panel textarea:focus,
    #gcx-panel select:focus,
    #gcx-coordinadores input:focus,
    #gcx-coordinadores textarea:focus,
    #gcx-coordinadores select:focus {
      --panel-campo-fondo: #ffffff;
      --panel-campo-borde: #0a0a0a;
    }

    /* El color de una categoría se elige con el selector nativo: sin fondo
       gris ni borde encima, que lo taparían. */
    #gcx-panel input[type="color"] {
      border: 0 !important;
      border-radius: 14px !important;
      background: transparent !important;
      padding: 0;
      cursor: pointer;
    }

    #gcx-panel ::placeholder,
    #gcx-coordinadores ::placeholder {
      color: rgba(0, 0, 0, .45) !important;

  <!-- Theme Pre-Load Script: Prevents flash of wrong theme -->
  <script>
      (function () {
        try {
          // Check localStorage for saved theme preference
          const savedConfig = localStorage.getItem('app_config');
          if (savedConfig) {
            const config = JSON.parse(savedConfig);
            if (config.themeMode === 'dark') {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
          } else {
            // Default to light mode if no preference saved
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          // Fallback to light mode on error
          document.documentElement.classList.remove('dark');
        }
      })();
  </script>
