<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex; flex-direction:column; color:{{ t.ink }}; font-family:Manrope,system-ui,sans-serif">
  <div style="display:flex; align-items:center; gap:12px; min-height:44px">
    <button onClick="{{ volver }}" aria-label="Volver" style="{{ roundBtn }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5L8 12l6.5 6.5"></path></svg></button>
    <h1 style="margin:0; font-size:{{ h1 }}; line-height:1.1; font-weight:600; letter-spacing:-.025em">Mi cuenta</h1>
  </div>

  <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">
    <div aria-busy="true" aria-label="Cargando">
      <div style="{{ card }}; display:flex; align-items:center; gap:14px; padding:16px; margin-top:22px">
        <div style="{{ sk }}; width:56px; height:56px; border-radius:999px; flex:none"></div>
        <div style="flex:1"><div style="{{ sk }}; width:55%; height:15px"></div><div style="{{ sk }}; width:75%; height:12px; margin-top:10px"></div></div>
      </div>
      <div style="{{ sk }}; height:148px; border-radius:26px; margin-top:14px"></div>
      <sc-for list="{{ skGroups }}" as="g" hint-placeholder-count="2">
        <div style="{{ sk }}; width:120px; height:11px; margin:28px 0 10px 6px"></div>
        <div style="{{ card }}">
          <sc-for list="{{ g.rows }}" as="s" hint-placeholder-count="3">
            <div style="display:flex; align-items:center; gap:14px; min-height:56px; padding:10px 16px; border-top:{{ s.bt }}">
              <div style="{{ sk }}; width:36px; height:36px; border-radius:999px; flex:none"></div>
              <div style="{{ sk }}; width:{{ s.w }}; height:13px"></div>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{ listo }}" hint-placeholder-val="{{ true }}">
    <button onClick="{{ irPerfil }}" aria-label="{{ personAria }}" style="{{ personBtn }}" style-hover="background:{{ t.hoverCard }}">
      <span style="{{ avatar }}">
        <sc-if value="{{ hayFoto }}" hint-placeholder-val="{{ false }}"><div style="width:100%; height:100%; background:center/cover no-repeat {{ fotoBg }}"></div></sc-if>
        <sc-if value="{{ sinFoto }}" hint-placeholder-val="{{ true }}">{{ iniciales }}</sc-if>
      </span>
      <span style="flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; text-align:left">
        <span style="font-size:17px; line-height:1.3; font-weight:600; letter-spacing:-.015em">{{ nombre }}</span>
        <span style="font-size:14px; line-height:1.35; font-weight:500; color:{{ t.m50 }}; overflow-wrap:anywhere">lucia.fernandez@gmail.com</span>
        <sc-if value="{{ hayFalta }}" hint-placeholder-val="{{ false }}">
          <span style="display:flex; align-items:center; gap:6px; margin-top:4px; font-size:13.5px; font-weight:600; color:{{ t.amberTxt }}"><span style="width:7px; height:7px; border-radius:999px; background:{{ t.amberTxt }}; flex:none"></span>{{ faltaTxt }}</span>
        </sc-if>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none; color:{{ t.m38 }}"><path d="M9.5 5.5L16 12l-6.5 6.5"></path></svg>
    </button>

    <div style="{{ featWrap }}">
      <div style="min-width:0; display:flex; flex-direction:column; align-items:flex-start">
        <sc-if value="{{ feat.esVerso }}" hint-placeholder-val="{{ false }}">
          <p style="margin:0; font-size:17.5px; line-height:1.5; font-weight:400; font-style:italic; letter-spacing:-.005em; text-wrap:pretty">“Lámpara es a mis pies tu palabra, y lumbrera a mi camino.”</p>
          <p style="margin:10px 0 0; font-size:13px; font-weight:600; letter-spacing:.02em; color:{{ t.m50 }}">Salmo 119:105 · Versículo del día</p>
        </sc-if>
        <sc-if value="{{ feat.noVerso }}" hint-placeholder-val="{{ true }}">
          <p style="margin:0; padding-right:34px; font-size:17px; line-height:1.3; font-weight:600; letter-spacing:-.015em; text-wrap:balance">{{ feat.titulo }}</p>
          <p style="margin:5px 0 0; font-size:14px; line-height:1.4; font-weight:500; color:{{ t.m66 }}; text-wrap:pretty">{{ feat.sub }}</p>
          <button onClick="{{ feat.go }}" style="{{ featBtn }}" style-active="transform:scale(.97)">{{ feat.btn }}</button>
        </sc-if>
      </div>
      <svg width="88" height="88" viewBox="0 0 96 96" fill="none" stroke="{{ feat.stroke }}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="align-self:end; flex:none"><path d="{{ feat.ill }}"></path></svg>
      <sc-if value="{{ feat.noVerso }}" hint-placeholder-val="{{ true }}">
        <button onClick="{{ cerrarFeat }}" aria-label="Ocultar esta tarjeta" style="position:absolute; top:6px; right:6px; width:44px; height:44px; border:0; background:transparent; display:flex; align-items:center; justify-content:center; cursor:pointer; color:{{ t.ink }}"><span style="width:28px; height:28px; border-radius:999px; background:{{ feat.xBg }}; display:flex; align-items:center; justify-content:center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></span></button>
      </sc-if>
    </div>

    <sc-for list="{{ secs }}" as="sec" hint-placeholder-count="5">
      <p style="{{ rot }}">{{ sec.t }}</p>
      <div style="{{ card }}">
        <sc-for list="{{ sec.rows }}" as="r" hint-placeholder-count="3">
          <div style="border-top:{{ r.bt }}">
            <button onClick="{{ r.go }}" role="{{ r.role }}" aria-checked="{{ r.checked }}" aria-label="{{ r.aria }}" disabled="{{ r.disabled }}" style="{{ r.btn }}" style-hover="{{ r.hov }}">
              <span style="{{ circle }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{ r.icon }}"></path></svg></span>
              <span style="flex:1; min-width:0; text-align:left; display:flex; flex-direction:column; gap:2px">
                <span style="font-size:15px; line-height:1.3; font-weight:600">{{ r.n }}</span>
                <sc-if value="{{ r.hasDet }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px; line-height:1.4; font-weight:500; color:{{ t.m50 }}; text-wrap:pretty">{{ r.det }}</span></sc-if>
              </span>
              <sc-if value="{{ r.hasVal }}" hint-placeholder-val="{{ false }}"><span style="flex:none; font-size:14.5px; font-weight:500; color:{{ t.m50 }}">{{ r.val }}</span></sc-if>
              <sc-if value="{{ r.hasBadge }}" hint-placeholder-val="{{ false }}"><span style="flex:none; min-width:22px; height:22px; padding:0 7px; border-radius:999px; background:#e5484d; color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center">{{ r.badge }}</span></sc-if>
              <sc-if value="{{ r.hasFalta }}" hint-placeholder-val="{{ false }}"><span style="flex:none; height:24px; padding:0 9px; border-radius:999px; background:{{ t.amberBg }}; color:{{ t.amberTxt }}; font-size:12px; font-weight:700; display:flex; align-items:center">Falta</span></sc-if>
              <sc-if value="{{ r.hasArrow }}" hint-placeholder-val="{{ true }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none; color:{{ t.m38 }}"><path d="M9.5 5.5L16 12l-6.5 6.5"></path></svg></sc-if>
              <sc-if value="{{ r.hasExt }}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none; color:{{ t.m38 }}"><path d="M8 16L16.5 7.5M9.5 7.5h7v7"></path></svg></sc-if>
              <sc-if value="{{ r.isToggle }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="{{ r.track }}"><span style="{{ r.knob }}"></span></span></sc-if>
            </button>
            <sc-if value="{{ r.hasHelp }}" hint-placeholder-val="{{ false }}">
              <button onClick="{{ r.onHelp }}" style="{{ helpBtn }}">{{ r.help }}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5L16 12l-6.5 6.5"></path></svg></button>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </sc-for>

    <button onClick="{{ salir }}" style="{{ logoutBtn }}" style-hover="background:{{ t.hoverCard }}">Cerrar sesión</button>
    <p style="margin:14px 0 0; text-align:center; font-size:12.5px; font-weight:500; color:{{ t.m50 }}">Origen App · versión 2.14</p>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:1400}}">
const IC = {

const FEAT = {

};
const ORDER = ['entrada', 'pedido', 'perfil', 'grupo', 'verso'];

class Component extends DCLogic {
  go(id) {
    const p = this.props, f = OWN[id];

    const groups = [

    ];
    const secs = groups.map(([tt, rows]) => ({ t: tt, rows: rows.map((r, i) => {

      const act = r.id === 'dark' ? () => p.onDark && p.onDark() : r.id === 'push' ? () => p.onPush && p.onPush() : () => this.go(r.id);
      return {
        n: r.n, icon: r.icon, det: r.det || '', hasDet: !!r.det, val: r.val ? r.val : '', hasVal: !!r.val,
        badge: r.badge > 9 ? '9+' : String(r.badge || ''), hasBadge: !!r.badge, hasFalta: !!r.falta,

      circle: 'width:36px; height:36px; flex:none; border-radius:999px; background:' + t.chip + '; color:' + t.ink + '; display:flex; align-items:center; justify-content:center; transition:' + tr,
      helpBtn: 'display:flex; align-items:center; gap:4px; min-height:44px; margin:-6px 0 4px 66px; padding:0 10px 0 0; border:0; background:transparent; color:' + t.ink + '; font:inherit; font-size:13.5px; font-weight:600; text-decoration:underline; text-underline-offset:3px; cursor:pointer',
      logoutBtn: card + '; width:100%; min-height:56px; margin-top:28px; border:0; color:' + t.redTxt + '; font:inherit; font-size:15px; font-weight:600; cursor:pointer',
      salir: () => p.onRow && p.onRow('logout')
    };
  }
}
</script>
</body>
